name: Continuous Integration
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Two migrations with one version: a database that has run one silently skips
  # the other (#792). Runs in seconds, separately from verify.
  migration-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # On a PR this checks out the merge commit; HEAD^1 is the base.
          fetch-depth: 2

      - name: Test the check
        run: .github/scripts/test_check_migration_versions.sh

      - name: Check migration versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: HEAD^1
          # Staging deploys only PRs to main, so only those are compared with
          # other open PRs. Pushes to main and PRs to other bases check the tree.
          SKIP_OPEN_PRS: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && '0' || '1' }}
        run: .github/scripts/check_migration_versions.sh

  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: [27]
        elixir: [1.18.4]

    services:
      db:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dbservice_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-elixir@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          experimental-otp: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/cache@v4
        id: deps-cache
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}

      - uses: actions/cache@v4
        id: build-cache
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}

      - name: Find yarn cache location
        id: yarn-cache
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install deps
        run: |
          mix deps.clean --all
          mix deps.get
          (cd assets && yarn)
      - name: Check formatting
        run: mix format --check-formatted

      # Don't cache PLTs based on mix.lock hash, as Dialyzer can incrementally update even old ones
      # Cache key based on Elixir & Erlang version (also useful when running in matrix)
      - name: Restore PLT cache
        uses: actions/cache@v4
        id: plt_cache
        with:
          key: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-plt
          restore-keys: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-plt
          path: priv/plts

      # Create PLTs if no cache was found
      - name: Create PLTs
        if: steps.plt_cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Run check
        run: mix check

      # - name: Run tests
      #   run: mix test